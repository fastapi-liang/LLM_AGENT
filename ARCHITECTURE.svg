<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="shadowDeep" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6366f1"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect width="1000" height="1220" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">LX-AICODING 系统架构图</text>
  <text x="500" y="68" text-anchor="middle" font-size="13" fill="#64748b">前端 → FastAPI → 编排层 → Agent 装配 → 流式解析 → 工具/模型 → 外部服务</text>

  <!-- ============ ① 前端层 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="92" width="920" height="86" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="64" y="118" font-size="13" font-weight="700" fill="#6366f1">① 前端层</text>
    <rect x="300" y="126" width="400" height="40" rx="9" fill="#ffffff" stroke="#c7d2fe"/>
    <text x="500" y="151" text-anchor="middle" font-size="14" font-weight="600" fill="#312e81">Vite / React Dashboard · :3000</text>
  </g>

  <!-- 箭头 1→2 -->
  <line x1="500" y1="178" x2="500" y2="206" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="196" font-size="11" fill="#64748b">POST /dashboard/api/threads/stream-message（单条 SSE）</text>

  <!-- ============ ② FastAPI API 层 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="208" width="920" height="150" rx="14" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="64" y="234" font-size="13" font-weight="700" fill="#0284c7">② FastAPI 应用层 · agent/app.py</text>

    <rect x="64" y="248" width="410" height="88" rx="9" fill="#ffffff" stroke="#bae6fd"/>
    <text x="80" y="272" font-size="13" font-weight="600" fill="#075985">event_iter（异步 · 事件循环）</text>
    <text x="80" y="294" font-size="12" fill="#334155">await queue.get() → yield _sse_part()</text>
    <text x="80" y="314" font-size="12" fill="#334155">→ 边跑边推给浏览器</text>

    <rect x="526" y="248" width="410" height="88" rx="9" fill="#ffffff" stroke="#bae6fd"/>
    <text x="542" y="272" font-size="13" font-weight="600" fill="#075985">worker 线程（同步 · daemon）</text>
    <text x="542" y="294" font-size="12" fill="#334155">run_agent_task(repo_url, prompt, ...)</text>
    <text x="542" y="314" font-size="12" fill="#334155">→ 真正运行 Agent</text>

    <rect x="470" y="262" width="60" height="34" rx="7" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="500" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309">Queue</text>
    <line x1="474" y1="292" x2="486" y2="292" stroke="#f59e0b" stroke-width="1.4" marker-end="url(#arrow)"/>
    <text x="484" y="340" text-anchor="middle" font-size="10" fill="#b45309">call_soon_threadsafe</text>
  </g>

  <!-- 箭头 2→3 -->
  <line x1="500" y1="358" x2="500" y2="386" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ ③ 编排层 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="388" width="920" height="128" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="64" y="414" font-size="13" font-weight="700" fill="#7c3aed">③ 编排层 · core/runtime.py — run_agent_task</text>

    <rect x="64" y="428" width="282" height="70" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="205" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">意图识别</text>
    <text x="205" y="470" text-anchor="middle" font-size="11" fill="#334155">classify_task_kind()</text>
    <text x="205" y="486" text-anchor="middle" font-size="10" fill="#64748b">关键词→LLM→安全护栏</text>

    <rect x="362" width="0" height="0"/>
    <rect x="360" y="428" width="282" height="70" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="501" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">人在回路</text>
    <text x="501" y="470" text-anchor="middle" font-size="11" fill="#334155">确认实施 / 修改方案</text>
    <text x="501" y="486" text-anchor="middle" font-size="10" fill="#64748b">coding 必须先有方案</text>

    <rect x="656" y="428" width="282" height="70" rx="9" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="797" y="450" text-anchor="middle" font-size="12" font-weight="600" fill="#6d28d9">流程分流</text>
    <text x="797" y="470" text-anchor="middle" font-size="11" fill="#334155">planning / coding / 只读</text>
    <text x="797" y="486" text-anchor="middle" font-size="10" fill="#64748b">直达分支不调模型</text>
  </g>

  <!-- 箭头 3→4 -->
  <line x1="500" y1="516" x2="500" y2="544" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ ④ Agent 装配层 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="546" width="920" height="160" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="64" y="572" font-size="13" font-weight="700" fill="#d97706">④ Agent 装配层 · server.py — get_agent → create_deep_agent</text>

    <rect x="64" y="588" width="430" height="100" rx="9" fill="#ffffff" stroke="#fde68a"/>
    <text x="80" y="610" font-size="13" font-weight="600" fill="#92400e">主 Agent（deepseek-v4-pro）</text>
    <text x="80" y="632" font-size="12" fill="#334155">10 个工具：web_search · fetch_url</text>
    <text x="80" y="650" font-size="12" fill="#334155">gitee（建 PR/评论/上下文）</text>
    <text x="80" y="668" font-size="12" fill="#334155">审查链（rules/diff/finding）</text>

    <rect x="526" y="588" width="410" height="100" rx="9" fill="#ffffff" stroke="#fde68a"/>
    <text x="542" y="610" font-size="13" font-weight="600" fill="#92400e">2 个子 Agent（只读）</text>
    <text x="542" y="632" font-size="12" fill="#334155">general-purpose：通用分析</text>
    <text x="542" y="650" font-size="12" fill="#334155">code_reviewer：6 个审查工具</text>
    <text x="542" y="668" font-size="12" fill="#334155">+ 权限 / 中间件 / 系统提示词</text>
  </g>

  <!-- 箭头 4→5 -->
  <line x1="500" y1="706" x2="500" y2="734" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="512" y="724" font-size="11" fill="#64748b">stream_events(version="v3")</text>

  <!-- ============ ⑤ 流式解析层 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="736" width="920" height="110" rx="14" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="64" y="762" font-size="13" font-weight="700" fill="#0891b2">⑤ 流式解析层 · core/streaming_runtime.py</text>

    <rect x="64" y="776" width="282" height="52" rx="9" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="205" y="798" text-anchor="middle" font-size="12" fill="#155e75">text-delta（正文 token）</text>
    <text x="205" y="816" text-anchor="middle" font-size="11" fill="#64748b">节流合并 → event_sink</text>

    <rect x="360" y="776" width="282" height="52" rx="9" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="501" y="798" text-anchor="middle" font-size="12" fill="#155e75">write_todos chunk</text>
    <text x="501" y="816" text-anchor="middle" font-size="11" fill="#64748b">任务清单逐项浮现</text>

    <rect x="656" y="776" width="282" height="52" rx="9" fill="#ffffff" stroke="#a5f3fc"/>
    <text x="797" y="798" text-anchor="middle" font-size="12" fill="#155e75">subagents 事件</text>
    <text x="797" y="816" text-anchor="middle" font-size="11" fill="#64748b">子 Agent 生命周期</text>
  </g>

  <!-- 箭头 5→6 -->
  <line x1="500" y1="846" x2="500" y2="874" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ ⑥ 工具层 + 模型层 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="876" width="440" height="150" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="64" y="902" font-size="13" font-weight="700" fill="#dc2626">⑥ 工具层 · tools/</text>
    <text x="64" y="926" font-size="12" fill="#334155">web_search · fetch_url</text>
    <text x="64" y="946" font-size="12" fill="#334155">gitee_tools → gitee_api.py（HTTP）</text>
    <text x="64" y="966" font-size="12" fill="#334155">reviewer_tools（审查链）</text>
    <text x="64" y="986" font-size="12" fill="#334155">safe_http.py（SSRF 防护）</text>
    <text x="64" y="1006" font-size="12" fill="#334155">LocalShellBackend（真实执行）</text>

    <rect x="520" y="876" width="440" height="150" rx="14" fill="#fdf2f8" stroke="#ec4899" stroke-width="1.5"/>
    <text x="544" y="902" font-size="13" font-weight="700" fill="#db2777">⑥ 模型层 · core/model.py</text>
    <text x="544" y="926" font-size="12" fill="#334155">make_main_model()</text>
    <text x="544" y="946" font-size="12" fill="#334155">　temperature=1.1 · streaming</text>
    <text x="544" y="970" font-size="12" fill="#334155">make_intent_model()</text>
    <text x="544" y="990" font-size="12" fill="#334155">　temperature=0 · 结构化输出</text>
  </g>

  <!-- 箭头 6→7 -->
  <line x1="260" y1="1026" x2="260" y2="1066" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="740" y1="1026" x2="740" y2="1066" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ============ ⑦ 外部服务 + 存储 ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="1068" width="920" height="128" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
    <text x="64" y="1094" font-size="13" font-weight="700" fill="#475569">⑦ 外部服务 &amp; 存储</text>

    <rect x="64" y="1108" width="200" height="68" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="164" y="1130" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">DeepSeek API</text>
    <text x="164" y="1148" text-anchor="middle" font-size="11" fill="#64748b">deepseek-v4-pro</text>
    <text x="164" y="1164" text-anchor="middle" font-size="11" fill="#64748b">推理 · 工具调用</text>

    <rect x="280" y="1108" width="200" height="68" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="380" y="1130" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">Gitee API</text>
    <text x="380" y="1148" text-anchor="middle" font-size="11" fill="#64748b">建 PR / 评论</text>
    <text x="380" y="1164" text-anchor="middle" font-size="11" fill="#64748b">读 PR 上下文</text>

    <rect x="496" y="1108" width="200" height="68" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="596" y="1130" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">智谱搜索</text>
    <text x="596" y="1148" text-anchor="middle" font-size="11" fill="#64748b">web_search</text>
    <text x="596" y="1164" text-anchor="middle" font-size="11" fill="#64748b">联网资料</text>

    <rect x="712" y="1108" width="224" height="68" rx="9" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="824" y="1130" text-anchor="middle" font-size="12" font-weight="600" fill="#334155">SQLite + checkpoint</text>
    <text x="824" y="1148" text-anchor="middle" font-size="11" fill="#64748b">业务摘要（threads/runs/events）</text>
    <text x="824" y="1164" text-anchor="middle" font-size="11" fill="#64748b">会话历史 / 待确认方案</text>
  </g>
</svg>
